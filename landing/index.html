<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spectral Connectomics Landing Page</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <style type="text/css">
        html,
        body {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            background: #EFEDE3;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: Arial, sans-serif;

        }

        #header {
            background-color: #EFEDE3;
            color: #fff;
            padding: 5px 0;
            flex: none;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        #interface {
            width: 100%;
            flex: auto;
        }

        .logo {
            height: 40px;
            width: auto;
            margin-right: 20px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-button {
            padding: 8px 12px;
            background-color: transparent;
            color: #000;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-button:hover {
            background-color: #000;
            color: #fff;
        }

        .download-roi-btn {
            background-color: #28a745;
            border-color: #28a745;
            color: #fff;
        }

        .download-roi-btn:hover {
            background-color: #218838;
            border-color: #218838;
        }

        /* Modal Dialog Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            color: #333;
            margin: 0;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background-color: #f5f5f5;
            color: #333;
        }

        .download-option {
            margin: 15px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            transition: all 0.3s;
        }

        .download-option:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .download-option strong {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .download-option p {
            color: #666;
            margin: 0 0 12px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .download-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        .modal-footer {
            margin-top: 25px;
            text-align: center;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }

        /* Form Styles */
        .form-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .form-row {
            margin: 15px 0;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .form-select,
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            background: white;
            transition: border-color 0.3s;
        }

        .form-select:focus,
        .form-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .roi-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .roi-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .roi-input-group label {
            font-weight: bold;
            color: #555;
            min-width: 25px;
            text-align: right;
        }

        .roi-range {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .roi-input {
            width: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
        }

        .roi-input:focus {
            outline: none;
            border-color: #007bff;
        }

        .roi-input:disabled {
            background-color: #f8f9fa;
            color: #6c757d;
            border-color: #e9ecef;
        }

        .whole-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
            font-size: 13px;
            color: #666;
        }

        .whole-checkbox input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
        }

        .whole-checkbox label {
            cursor: pointer;
            font-weight: normal;
            margin: 0;
            min-width: auto;
        }

        .download-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .primary-btn {
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .primary-btn:hover {
            background-color: #218838;
            transform: translateY(-1px);
        }

        .secondary-btn {
            background-color: #6c757d;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .secondary-btn:hover {
            background-color: #5a6268;
        }
    </style>

</head>

<body>

    <div id="header">
        <img src="./img/logo.png" alt="Spectral Connectomics Logo; A brain cartoon with a neural network drawn inside."
            class="logo">

        <div class="nav-buttons">
            <button class="nav-button download-roi-btn" onclick="openROIDownload()">Download ROI</button>
            <a id="dashboardButton" class="nav-button" target="_blank">Open Dashboard</a>
        </div>
    </div>

    <iframe id="interface"></iframe>

    <!-- ROI Download Modal Dialog -->
    <div id="roiDialog" class="modal-overlay" onclick="event.target === this && closeROIDialog()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Download ROI Data</h2>
                <button class="close-btn" onclick="closeROIDialog()">&times;</button>
            </div>

            <div class="form-section">
                <div class="form-row">
                    <label class="form-label" for="layer">Image Layer</label>
                    <select id="layer" class="form-select">
                        <option value="">Select layer...</option>
                    </select>
                </div>

                <div class="form-row">
                    <label class="form-label" for="resolution">Resolution</label>
                    <select id="resolution" class="form-select">
                        <option value="">Select resolution...</option>
                    </select>
                </div>

                <div class="form-row">
                    <label class="form-label">ROI Specification (Pixels)</label>
                    <div class="roi-grid">
                        <div class="roi-input-group">
                            <label>X:</label>
                            <div class="roi-range">
                                <input type="number" id="xStart" class="roi-input" placeholder="Start" min="0">
                                <span>to</span>
                                <input type="number" id="xEnd" class="roi-input" placeholder="End" min="0">
                            </div>
                            <div class="whole-checkbox">
                                <input type="checkbox" id="wholeX">
                                <label for="wholeX">Whole</label>
                            </div>
                        </div>
                        <div class="roi-input-group">
                            <label>Y:</label>
                            <div class="roi-range">
                                <input type="number" id="yStart" class="roi-input" placeholder="Start" min="0">
                                <span>to</span>
                                <input type="number" id="yEnd" class="roi-input" placeholder="End" min="0">
                            </div>
                            <div class="whole-checkbox">
                                <input type="checkbox" id="wholeY">
                                <label for="wholeY">Whole</label>
                            </div>
                        </div>
                        <div class="roi-input-group">
                            <label>Z:</label>
                            <div class="roi-range">
                                <input type="number" id="zStart" class="roi-input" placeholder="Start" min="0">
                                <span>to</span>
                                <input type="number" id="zEnd" class="roi-input" placeholder="End" min="0">
                            </div>
                            <div class="whole-checkbox">
                                <input type="checkbox" id="wholeZ">
                                <label for="wholeZ">Whole</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="download-actions">
                <button class="primary-btn" onclick="downloadROI()">Start Download</button>
                <button class="secondary-btn" onclick="closeROIDialog()">Cancel</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
